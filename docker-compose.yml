services:
  pipeline_kdd:
    build: .
    container_name: bda_pipeline_kdd_container
    volumes:
      # Sincronizamos las carpetas locales con el contenedor para ver los logs,
      # informes y datasets generados directamente en tu máquina anfitriona.
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./output_samples:/app/output_samples
      - ./processed:/app/processed
      - ./staging:/app/staging
      - ./quarantine:/app/quarantine
    command: sh -c "python scripts/01_verificar_integridad.py && python scripts/02_pipeline_saneamiento.py"